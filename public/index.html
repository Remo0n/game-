<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <meta property="og:title" content="Bento Blocks" />
    <meta
      property="og:description"
      content="A cozy puzzle break. Slice colorful food blocks and find your perfect fit."
    />
    <meta property="og:type" content="website" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }
      html {
        height: 100%;
        background: #f7f5ec;
      }
      body {
        height: 100%;
        overflow: hidden;
      }
      #root {
        display: flex;
        flex: 1;
        height: 100%;
      }
      * {
        box-sizing: border-box;
      }
      button:focus-visible,
      a:focus-visible,
      [role="button"]:focus-visible {
        outline: 3px solid #426b4e;
        outline-offset: 3px;
      }
      #noscript {
        font: 18px/1.6 system-ui;
        padding: 40px;
        color: #293d32;
        max-width: 620px;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <noscript
      ><div id="noscript">
        <h1>Bento Blocks</h1>
        Enable JavaScript to play this puzzle game.
      </div></noscript
    >
    <div id="root"></div>
  </body>
</html>
